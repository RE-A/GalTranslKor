# 캐릭터 사전 (예제 장면용 합성 인물)
# ja(일본어 이름)는 필수입니다. 화자로 등장하거나 문장에 이름이 나온 인물만 모델에 전달됩니다.
# 한국어 이름을 출력 TXT의 화자 표기에도 쓰려면 glossary.txt에도 같은 이름을 적으세요.
characters:
  - ja: 湊
    ko: 미나토
    aliases: [湊くん, お兄ちゃん]
    personality: 주인공(1인칭 서술 "俺"). 무뚝뚝하지만 속이 깊고 진로 문제로 망설이고 있다.
    speech: 친구와 여동생에게는 짧은 반말. 선생님에게는 존댓말.
    honorifics: 葵와 結衣에게 반말, 先生에게 존댓말
    relationships: 葵와 어릴 적부터 친구, 結衣의 오빠
  - ja: 葵
    ko: 아오이
    aliases: [葵先輩]
    personality: 밝고 다정하며 장난기가 있다. 진지한 순간에는 수줍어한다.
    speech: 湊에게 부드러운 반말("~잖아", "~네"). 結衣에게도 다정한 반말.
    honorifics: 湊를 "미나토"라고 부른다(湊くん). 結衣를 "유이"라고 부른다(結衣ちゃん).
    relationships: 湊의 소꿉친구이자 같은 반. 結衣의 학교 선배
  - ja: 結衣
    ko: 유이
    personality: 湊의 여동생. 활발하고 덤벙대지만 예의 바르다.
    speech: 오빠에게는 애교 섞인 반말, 葵에게는 공손한 존댓말
    honorifics: 湊를 "오빠"(お兄ちゃん), 葵를 "아오이 선배"(葵先輩)라고 부른다
    relationships: 湊의 여동생, 葵의 후배
  - ja: 先生
    ko: 선생님
    personality: 湊의 담임. 엄격하지만 학생을 배려한다.
    speech: 학생에게 차분한 반말 투의 지도 말투("~하도록", "~하렴")
