Core:
  Name: 기계 번역 품질 평가
  Type: file
  Module: file_mtbench_aio

Documentation:
  Author: cx2333
  Version: 2.0
  Description: "기계 번역 품질을 평가합니다. 입력 파일은 ref 필드가 추가된 name(선택)-message json이며, ref에 참조 번역을 넣습니다."

Settings: # 플러그인 설정
  task: "chrf"  # 평가 지표. chrf/comet/cutoff_rate 지원
  chrf_ngram: 4
  chrf_beta: 2
  comet_model_name: "Unbabel/wmt22-comet-da"
  comet_batch_size: 8

SettingsSchema:
  task:
    label: 평가 지표
    description: "번역 품질 평가 방식을 고릅니다. COMET은 모델을 불러와야 하며, 잘림 비율은 번역이 잘렸는지 검사합니다."
    advanced: false
    options:
    - value: chrf
      label: chrF 문자 일치
    - value: comet
      label: COMET 모델 점수
    - value: cutoff_rate
      label: 잘림 비율
  chrf_ngram:
    label: chrF 최대 n-gram
    description: chrF가 쓰는 최대 문자 n-gram 길이. chrF 모드에서만 적용됩니다.
    advanced: true
    min: 1
    step: 1
  chrf_beta:
    label: chrF 재현율 가중치
    description: chrF에서 재현율의 상대 가중치. 값이 클수록 재현율을 중시합니다.
    advanced: true
    min: 0.1
    step: 0.1
  comet_model_name:
    label: COMET 모델
    description: COMET이 사용할 모델 이름 또는 경로. COMET 모드에서만 적용됩니다.
    advanced: true
  comet_batch_size:
    label: COMET 배치 크기
    description: 배치당 평가할 항목 수. 값이 클수록 GPU 메모리를 더 쓸 수 있습니다.
    advanced: true
    min: 1
    step: 1
