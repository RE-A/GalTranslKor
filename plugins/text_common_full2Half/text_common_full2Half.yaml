Core:
  Name: 공통 - 전각/반각 변환
  Type: text
  Module: text_common_full2Half

Documentation:
  Author: PiDanShouRouZhou
  Version: 1.1
  Description: "전각 문자(숫자, 대소문자, 문장부호)와 반각 문자를 서로 변환합니다. 치환표와 치환 시점을 지정할 수 있습니다."

Settings: # 플러그인 설정
  是否替换标点: False
  替换时机: "before_src_processed" # [before_src_processed/after_src_processed/before_dst_processed/after_dst_processed] 기본은 번역 전 변환
  反向替换: False # True면 반대로 전각 문자로 변환
  自定义替换表: {} # 사용자 지정 치환표. 반대 방향 변환 여부와 관계없이 { "전각 문자": "반각 문자" } 형식

# 기본 치환표:
# {
#     '。': '.', '，': ',', '、': '\\', '；': ';', '：': ':',
#     '？': '?', '！': '!', '"': '"', '"': '"', ''': "'", ''': "'",
#     '（': '(', '）': ')', '【': '[', '】': ']', '《': '<', '》': '>',
#     '「': '[', '」': ']', '『': '{', '』': '}', '〔': '[', '〕': ']',
#     '｛': '{', '｝': '}', '［': '[', '］': ']',
#     '％': '%', '＋': '+', '－': '-', '＊': '*', '／': '/', '＝': '=',
#     '＜': '<', '＞': '>', '＆': '&', '＄': '$', '＃': '#', '＠': '@',
#     '＾': '^', '｜': '|', '～': '~', '｀': '`',
#     '　': ' ',  # 전각 공백을 반각 공백으로
#     '…': '...', '—': '-', '－': '-', 'ー': '-',  # 여러 가지 가로줄
#     '・': '·', '·': '·',  # 가운뎃점
#     '′': "'", '″': '"',  # 분·초 기호
#     '〜': '~', '～': '~',  # 물결표
#     '〇': '0',  # 한자 영
#     '￥': '¥', '￠': '¢', '￡': '£', '€': 'E',  # 통화 기호
# }

SettingsSchema:
  是否替换标点:
    label: 문장부호도 변환
    description: 숫자와 영문자 외에 기본 치환표의 문장부호도 변환합니다.
    advanced: false
  替换时机:
    label: 실행 단계
    description: "원문과 번역문 중 무엇을 처리할지, 해당 텍스트 처리 단계 전후 중 언제 실행할지 고릅니다."
    advanced: false
    options:
    - value: before_src_processed
      label: 원문 전처리 전
    - value: after_src_processed
      label: 원문 전처리 후
    - value: before_dst_processed
      label: 번역문 후처리 전
    - value: after_dst_processed
      label: 번역문 후처리 후
  反向替换:
    label: 반각을 전각으로
    description: "끄면 전각을 반각으로, 켜면 반대로 변환합니다."
    advanced: false
  自定义替换表:
    label: 사용자 지정 문자 치환표
    description: "JSON 객체를 입력하세요. 예: {\"Ａ\":\"A\"}. 항상 “전각 문자: 반각 문자”로 적으며, 반대 방향 변환 때는 자동으로 뒤집습니다."
    advanced: true
