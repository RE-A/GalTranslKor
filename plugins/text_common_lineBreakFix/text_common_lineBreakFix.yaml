Core:
  Name: 문장 내 줄바꿈 수정
  Type: text
  Module: text_common_lineBreakFix

Documentation:
  Author: PiDanShouRouZhou
  Version: 1.2
  Description: 번역 전후 텍스트를 비교해 번역문의 줄바꿈을 더하거나 빼서 개수를 맞춥니다.

Settings: 
  换行符: "\r\n"

  换行模式: "保持位置"  # [平均|切最长|保持位置|前置|后置|固定字数]
  分段字数阈值: 21  # 固定字数(고정 길이) 방식에서만 적용
  # 平均(균등): 기존 줄바꿈을 무시하고 텍스트를 똑같이 나눈 지점에 줄바꿈을 넣음
  # 切最长(가장 긴 구간 분할): 기존 줄바꿈을 유지하고 목표 개수가 될 때까지 가장 긴 구간을 가운데서 자름
  # 保持位置(위치 유지): 기존 줄바꿈을 무시하고 원문 줄바꿈의 상대 위치에 맞춰 다시 배치
  # 前置(앞): 모든 줄바꿈을 텍스트 맨 앞에 둠
  # 后置(뒤): 모든 줄바꿈을 텍스트 맨 뒤에 둠
  # 固定字数(고정 길이): 원문 줄바꿈과 관계없이 글자 수가 分段字数阈值에 이르면 줄바꿈을 넣음

  强制修复: false  # 원문과 번역문의 줄바꿈 수가 같아도 강제로 재배치할지
  分词器: "budoux"  # [budoux|jieba|pkuseg|hanlp] 
  # 분절기 선택:
  # budoux가 가장 가벼우며 기본값.
  # jieba는 분절이 더 좋지만 jieba 라이브러리가 필요(중국어용).
  # pkuseg는 jieba보다 좋지만 pkuseg 라이브러리가 필요(중국어용).
  # hanlp는 hanlp 라이브러리 외에 모델 파일과 pytorch(1GB+)를 내려받아야 함.


# 예

# 원문:
# This is a piece of text, [r]which contains some line breaks. [r]The number of these line breaks is uncertain. [r]

# 줄바꿈을 잃은 번역문:
# 이것은 몇 개의 줄바꿈을 포함한 텍스트입니다.[r]줄바꿈의 개수는 정해져 있지 않습니다.

# 平均(균등):
# 이것은 몇 개의 줄[r]바꿈을 포함한 텍스트[r]입니다. 줄바꿈의 개수는[r] 정해져 있지 않습니다.


# 切最长(가장 긴 구간 분할):
# 이것은 몇 개의 줄바꿈을[r] 포함한 텍스트입니다.[r]줄바꿈의 개수는 정해져[r] 있지 않습니다.

# 保持位置(위치 유지):
# "This [r] is a piece of text, which contains [r] some line[r] breaks."
# 이것은[r] 몇 개의 줄바꿈을 포함한 텍스트입니다.[r]추가된 줄[r]바꿈.


# 줄바꿈이 네 개라면:
# 원문:
# This is a piece of text, [r]which contains some line breaks. [r]The number of these line breaks is uncertain. [r]And here's one more break.[r]

# 줄바꿈을 잃은 번역문:
# 이것은 몇 개의 줄바꿈을 포함한 텍스트입니다.[r]줄바꿈의 개수는 정해져 있지 않습니다. 여기 줄바꿈이 하나 더 있습니다.

# 切最长(줄바꿈 네 개):
# 이것은 몇 개의 줄바꿈을[r] 포함한 텍스트입니다.[r]줄바꿈의 개수는[r] 정해져 있지 않습니다.[r] 여기 줄바꿈이 하나 더 있습니다.

# 固定字数(고정 길이):
# 기준을 10자로 가정
# 원문: "This is a long text without line breaks."
# 번역문: "줄바꿈이 없는 긴 텍스트입니다."
# 처리 후: "줄바꿈이 없는 긴 텍[r]스트입니다."

SettingsSchema:
  换行符:
    label: 스크립트 줄바꿈 표기
    description: "스크립트가 쓰는 줄바꿈 표기(예: [r])를 입력합니다. 실제 줄바꿈도 입력할 수 있으며 기본은 Windows 줄바꿈(CRLF)입니다."
    advanced: false
    multiline: true
  换行模式:
    label: 줄바꿈 방식
    description: "위치 유지는 원문의 상대 위치에서 줄을 바꾸고, 균등은 텍스트를 고르게 나누며, 가장 긴 구간 분할은 가장 긴 구간을 반복해서 나누고, 앞/뒤는 줄바꿈을 처음이나 끝에 모으며, 고정 길이는 기준 글자 수에서 줄을 바꿉니다."
    advanced: false
    options:
    - value: 保持位置
      label: 위치 유지
    - value: 平均
      label: 균등
    - value: 切最长
      label: 가장 긴 구간 분할
    - value: 前置
      label: 앞
    - value: 后置
      label: 뒤
    - value: 固定字数
      label: 고정 길이
  分段字数阈值:
    label: 구간당 글자 수
    description: "고정 길이 방식에서만 적용되며, 이 글자 수에 도달하면 줄바꿈 표기를 넣습니다."
    advanced: false
    min: 1
    step: 1
  强制修复:
    label: 강제 재배치
    description: 번역문과 원문의 줄바꿈 수가 같아도 선택한 방식으로 텍스트를 처리합니다.
    advanced: true
  分词器:
    label: 중국어 분절기
    description: "가능하면 단어 중간에서 줄이 바뀌지 않게 합니다. BudouX가 가장 가볍고, 다른 선택지는 추가 의존성이 필요하며 HanLP는 큰 모델을 내려받을 수 있습니다."
    advanced: true
    options:
    - value: budoux
      label: "BudouX (가벼움, 권장)"
    - value: jieba
      label: Jieba
    - value: pkuseg
      label: PKUSEG (북경대 분절기)
    - value: hanlp
      label: HanLP
