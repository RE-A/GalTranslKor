Core:
  Name: BGI 루비 태그 수정
  Type: text
  Module: text_bgi_fixruby

Documentation:
  Author: lifegpc
  Version: 1.0
  Description: 잘못된 루비 태그 제거와 강조점(・) 개수 자동 보정을 지원합니다

Settings: # 플러그인 설정
  # 잘못된 루비 태그 제거
  remove_incorrect: true
  # 강조점(・) 개수 자동 보정
  auto_correct: true
  # 수정한 텍스트를 로그로 남길 때의 수준
  process_log_level: debug

SettingsSchema:
  remove_incorrect:
    label: 잘못된 루비 태그 제거
    description: 번역문에서 불완전하거나 짝이 맞지 않거나 비어 있는 BGI 루비 태그를 정리합니다.
    advanced: false
  auto_correct:
    label: 강조점 개수 보정
    description: 루비 위치의 강조점(・ 또는 …)을 본문 길이와 같은 개수로 맞춥니다.
    advanced: false
  process_log_level:
    label: 수정 로그 수준
    description: "수정한 텍스트마다 남길 로그 수준. 보통 debug를 유지하고, 문제를 조사할 때 info를 쓸 수 있습니다."
    advanced: true
    options:
    - value: debug
      label: 디버그
    - value: info
      label: 정보
    - value: warning
      label: 경고
    - value: error
      label: 오류
