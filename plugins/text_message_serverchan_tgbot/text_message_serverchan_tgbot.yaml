Core:
  Name: 완료 알림
  Type: text
  Module: text_message_serverchan_tgbot

Documentation:
  Author: PiDanShouRouZhou
  Version: 1.3
  Description: 번역이 끝나면 ServerChan / Telegram Bot으로 완료 메시지를 보내고 소리 알림을 지원합니다

Settings:
  推送渠道: # 알림 채널. 여러 개 선택 가능
    - ServerChan
    - Telegram Bot
  Telegram_Bot_API_URL: "https://api.telegram.org"
  Telegram_Bot_Token: ""
  Telegram_Bot_ChatID: ""
  ServerChan_SendKey: ""

  # 소리 알림 설정
  启用声音通知: false
  # 사용자 지정 소리 파일 경로. 끄면 기본 소리 사용
  使用自定义音频: false
  成功音频路径: "custom_sound/success_Asta_happy.wav"
  失败音频路径: "custom_sound/fail_Asta_sad.wav"
  # OpenAI TTS로 전체 안내 음성 합성
  使用OpenAI TTS: false
  OpenAI_API_Key: ""
  OpenAI_API_Base_URL: "https://api.openai.com/v1"
  OpenAI_TTS_Voice: "onyx" # alloy, echo, fable, onyx, nova, shimmer 중 선택

SettingsSchema:
  推送渠道:
    label: 완료 알림 채널
    description: 번역이 끝났을 때 알림을 받을 채널을 고릅니다(여러 개 가능). 모든 채널을 해제하면 네트워크 알림을 끕니다.
    advanced: false
    options:
    - value: ServerChan
      label: Server酱 (ServerChan)
    - value: Telegram Bot
      label: Telegram 봇
  Telegram_Bot_API_URL:
    label: Telegram API 주소
    description: 기본은 공식 Telegram API입니다. 직접 운영하는 엔드포인트나 프록시 서비스를 쓸 때만 바꾸세요.
    advanced: true
  Telegram_Bot_Token:
    label: Telegram 봇 토큰
    description: BotFather가 준 봇 토큰. Telegram 알림을 켰을 때만 사용합니다.
    advanced: false
    secret: true
  Telegram_Bot_ChatID:
    label: Telegram 대상 채팅 ID
    description: 알림을 받을 사용자 또는 그룹 채팅 ID. 봇에게 해당 채팅에 메시지를 보낼 권한이 있어야 합니다.
    advanced: false
  ServerChan_SendKey:
    label: Server酱 SendKey
    description: Server酱 계정의 SendKey. Server酱 알림을 켰을 때만 사용합니다.
    advanced: false
    secret: true
  启用声音通知:
    label: 완료 소리 재생
    description: 번역이 끝나면 성공 또는 실패 소리를 냅니다.
    advanced: false
  使用自定义音频:
    label: 사용자 지정 소리 사용
    description: 켜면 아래 지정한 오디오 파일을 씁니다. 소리 알림도 켜야 합니다.
    advanced: true
  成功音频路径:
    label: 성공 소리 경로
    description: 성공 시 재생할 오디오 파일. 사용자 지정 소리를 켰을 때만 적용됩니다.
    advanced: true
  失败音频路径:
    label: 실패 소리 경로
    description: 실패 시 재생할 오디오 파일. 사용자 지정 소리를 켰을 때만 적용됩니다.
    advanced: true
  使用OpenAI TTS:
    label: 음성 합성으로 읽어 주기
    description: OpenAI 호환 음성 합성 API로 안내 음성을 만듭니다. 소리 알림과 API 키가 필요하며 비용이 들 수 있습니다.
    advanced: true
  OpenAI_API_Key:
    label: 음성 합성 API 키
    description: 음성 합성 서비스의 API 키. 음성 합성을 켰을 때만 사용합니다.
    advanced: true
    secret: true
  OpenAI_API_Base_URL:
    label: 음성 합성 API 주소
    description: OpenAI 호환 서비스의 기본 주소. 보통 /v1로 끝납니다.
    advanced: true
  OpenAI_TTS_Voice:
    label: 안내 음성
    description: 음성 합성 목소리를 고릅니다. 실제 사용 가능한 목소리는 서비스에 따라 다릅니다.
    advanced: true
    options:
    - value: alloy
      label: 중성 (Alloy)
    - value: echo
      label: 차분함 (Echo)
    - value: fable
      label: 이야기체 (Fable)
    - value: onyx
      label: 낮은 음색 (Onyx)
    - value: nova
      label: 밝음 (Nova)
    - value: shimmer
      label: 부드러움 (Shimmer)
