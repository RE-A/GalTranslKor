Core:
  Name: Translator++ xlsx 파일
  Type: file
  Module: file_translator++_xlsx
  Extensions: [".xlsx"] # 파일 플러그인 자동 인식 때 확장자로 판별

Documentation:
  Author: PiDanShouRouZhou
  Version: 1.0
  Description: Translator++에서 내보낸 xlsx 파일. 결과는 Machine translation 시트에 다시 씁니다.

Settings: # 플러그인 설정
  是否自动识别名称: False  
  名称识别正则表达式: ^(?P<name>.*?)(?P<message>「.*?」)$ # 이름 인식 정규식. 두 그룹이 각각 name과 message
  名称识别拼接方案: "{name}\n{message}" # 이름 결합 형식(f-string). {name}은 이름, {message}는 본문
  清除换行符: False # 내보낸 xlsx 파일의 줄바꿈을 지울지

SettingsSchema:
  是否自动识别名称:
    label: 이름 자동 인식
    description: 지정한 규칙으로 화자와 본문을 분리합니다.
    advanced: false
  名称识别正则表达式:
    label: 이름 인식 규칙
    description: 정규식에는 name과 message 두 이름 그룹이 있어야 합니다.
    advanced: true
  名称识别拼接方案:
    label: 이름과 본문 결합 형식
    description: "{name}과 {message}로 이름과 번역문을 다시 합칩니다."
    advanced: true
    multiline: true
  清除换行符:
    label: 줄바꿈 제거
    description: Translator++ 시트에 쓸 때 텍스트의 줄바꿈을 제거합니다.
    advanced: false
