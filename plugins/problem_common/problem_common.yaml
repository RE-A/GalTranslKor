Core:
  Name: 공통 문제 검사
  Type: problem
  Module: problem_common

Documentation:
  Author: GalTransl
  Version: 1.0
  Description: 일본어 잔류, 문장부호, 줄바꿈, 사전 적용 등의 문제를 검사합니다. 검사 항목과 기준값은 프로젝트의 problemAnalyze 설정을 따릅니다.

Settings:
  avgSentenceLengthThreshold: 17

SettingsSchema:
  avgSentenceLengthThreshold:
    label: 긴 문장 기준값
    description: 구간 평균 길이가 이 값을 넘으면 긴 문장으로 표시합니다. 권장 범위 15–25. 긴 문장 검사를 켜야 합니다.
    min: 1
    step: 1
    legacy_path: problemAnalyze.avgSentenceLengthThreshold
